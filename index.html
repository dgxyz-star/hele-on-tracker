<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Complete Island Transit Tracker</title>
    <!-- Leaflet CSS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #e0e0e0; }
        #controls { padding: 10px; background: #1e1e1e; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #333; align-items: center; }
        button, select { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        select { background: #2a2a2a; border: 1px solid #444; max-width: 280px; }
        button:hover, select:hover { background: #1d4ed8; }
        button.cache-active { background: #16a34a; }
        #status { font-size: 0.85rem; color: #4ade80; margin-left: auto; font-weight: bold; }
        #alerts-bar { background: #854d0e; color: #fef08a; padding: 8px 10px; font-size: 0.85rem; display: none; border-bottom: 1px solid #713f12; }
        #map { flex: 1; width: 100%; background: #1a1a1a; }
        #info-panel { background: #1e1e1e; padding: 12px; border-top: 1px solid #333; font-size: 0.9rem; max-height: 190px; overflow-y: auto; line-height: 1.4; }
        #info-panel a { color: #60a5fa; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

    <div id="controls">
        <select id="route-select" onchange="filterRouteSchedule()">
            <option value="all">-- View All Island Routes --</option>
            <option value="route-1">Route 1: Hilo to Kailua-Kona</option>
            <option value="route-2">Route 2 (Blue Line): Hilo / Kona via Saddle</option>
            <option value="route-10">Route 10: Hilo to Ocean View</option>
            <option value="route-11">Route 11 (Red Line): Hilo to Volcano</option>
            <option value="route-40">Route 40: Hilo to Pahoa</option>
            <option value="route-80">Route 80: Hilo to South Kohala Resorts</option>
            <option value="route-101">Route 101: Intra-Hilo Keaukaha</option>
            <option value="route-102">Route 102: Intra-Hilo Kaumana</option>
            <option value="route-103">Route 103: Intra-Hilo Waiakea Uka</option>
            <option value="route-104">Route 104: Intra-Hilo Mohouli</option>
            <option value="route-401">Route 401: Hawaiian Beaches / Puna</option>
            <option value="route-402">Route 402: Hawaiian Paradise Park / Ainaloa</option>
            <option value="route-201">Route 201: Kona Trolley / Alii Drive</option>
            <option value="route-202">Route 202: Central Kailua-Kona</option>
        </select>
        <button onclick="fetchLiveBuses()">Reload Network</button>
        <button onclick="locateUser()">Locate Me</button>
        <button id="cache-btn" onclick="toggleOfflineMode()">Cache Mode: ON</button>
        <span id="status">Status: Ready</span>
    </div>

    <div id="alerts-bar"><strong>Service Alert:</strong> <span id="alert-text">Checking for notices...</span></div>

    <div id="map"></div>

    <div id="info-panel">
        <strong>Transit Info:</strong> Select a route above to highlight its path in bright color, view official stop markers, check transfer connection points, and access direct official county PDF schedule links.
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

                stops: [

                ]

                color: '#8b5cf6',
                pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps',

                stops: [

                ]

            {
                id: 'route-201',

                pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps',
                path: [[19.6400, -155.9969], [19.6300, -155.9900]],
                stops: [
                    { name: 'Loloku Street Park and Ride (Kona Hub)', lat: 19.6400, lng: -155.9969, schedule: 'Cross-island connection terminal', isTransfer: true },
                    { name: 'Route 201: Kona Trolley / Alii Drive', lat: 19.6300, lng: -155.9900, schedule: 'Keauhou Shopping Center to Kailua Village', isTransfer: false }
                ]
            },
            {
                id: 'route-202',
                routeTitle: 'Route 202: Central Kailua-Kona',
                color: '#ec4899',
                pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps',
                path: [[19.6400, -155.9969], [19.6420, -155.9950]],
                stops: [
                    { name: 'Loloku Street Park and Ride (Kona Hub)', lat: 19.6400, lng: -155.9969, schedule: 'Cross-island connection terminal', isTransfer: true },
                    { name: 'Route 202: Central Kailua-Kona', lat: 19.6420, lng: -155.9950, schedule: 'Kona Town Commercial Loop', isTransfer: false }

        window.addEventListener('DOMContentLoaded', () => {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            updateCacheButtonStyle(current);
            checkServiceAlerts();
            
            if (!localStorage.getItem('heleon_cached_bus_data')) {
                localStorage.setItem('heleon_cached_bus_data', JSON.stringify(heleOnRoutesData));
            }
            fetchLiveBuses();
        });

        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        const transferHubIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/2838/2838912.png',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        function locateUser() {
            document.getElementById('status').innerText = 'Status: Locating...';
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    userCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.marker([userCoords.lat, userCoords.lng])
                        .addTo(map)
                        .bindPopup("<b>You are here</b>")
                        .openPopup();

                    map.setView([userCoords.lat, userCoords.lng], 13);
                    document.getElementById('status').innerText = 'Status: Position Located';
                }, error => {
                    document.getElementById('status').innerText = 'Status: GPS Failed';
                    alert('Unable to acquire location. Check browser location permissions.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }

        function getWalkTimeEstimate(targetLat, targetLng) {
            if (!userCoords) return "Locate yourself via button above for walk time estimates.";

            const R = 3958.8;
            const dLat = (targetLat - userCoords.lat) * Math.PI / 180;
            const dLon = (targetLng - userCoords.lng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(userCoords.lat * Math.PI / 180) * Math.cos(targetLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            const walkSpeedMph = 3.0;
            const timeMinutes = Math.round((distance / walkSpeedMph) * 60);

            return `${distance.toFixed(2)} mi away (~${timeMinutes} min walk at 3mph)`;
        }

        function fetchLiveBuses() {
            document.getElementById('status').innerText = 'Status: Loading network...';
            clearMapOverlays();

            const cachedData = localStorage.getItem('heleon_cached_bus_data');
            if (cachedData) {
                const routes = JSON.parse(cachedData);
                renderAllRoutes(routes);
                document.getElementById('status').innerText = `Status: Ready (${routes.length} routes loaded)`;
            } else {
                alert('No schedule data found.');
            }
        }

        function renderAllRoutes(routes) {
            routes.forEach(route => {
                // Draw bold, high-visibility colored path polylines
                if (route.path && route.path.length > 0) {
                    const polyline = L.polyline(route.path, {
                        color: route.color || '#22c55e',
                        weight: 5,
                        opacity: 0.9
                    }).addTo(map);
                    routePolylines.push(polyline);
                }

                // Render stops & transfer hubs
                route.stops.forEach(stop => {
                    const iconToUse = stop.isTransfer ? transferHubIcon : busIcon;
                    const marker = L.marker([stop.lat, stop.lng], { icon: iconToUse })
                        .addTo(map)
                        .bindPopup(`<b>${stop.name}</b><br>${route.routeTitle}<br>Schedule: ${stop.schedule}`);
                    
                    marker.on('click', () => {
                        document.getElementById('info-panel').innerHTML = `
                            <strong>Stop Name:</strong> ${stop.name}<br>
                            <strong>Route:</strong> ${route.routeTitle}<br>
                            <strong>Details:</strong> ${stop.schedule}<br>
                            <strong>Connection Hub:</strong> ${stop.isTransfer ? '<span style="color:#22c55e; font-weight:bold;">Yes - Transfer / Layover Hub</span>' : 'Standard Stop'}<br>
                            <strong>Your Distance:</strong> ${getWalkTimeEstimate(stop.lat, stop.lng)}<br>
                            <strong>Official County PDF:</strong> <a href="${route.pdfUrl}" target="_blank">Open Schedule Document</a>
                        `;
                    });

                    busMarkers.push(marker);
                });
            });
        }

        function filterRouteSchedule() {
            const selectedRouteId = document.getElementById('route-select').value;
            clearMapOverlays();

            const cachedData = JSON.parse(localStorage.getItem('heleon_cached_bus_data') || '[]');
            const filteredRoutes = selectedRouteId === 'all' 
                ? cachedData 
                : cachedData.filter(r => r.id === selectedRouteId);

            renderAllRoutes(filteredRoutes);

            if (selectedRouteId !== 'all' && filteredRoutes.length > 0) {
                const route = filteredRoutes[0];
                if (route.path && route.path.length > 0) {
                    map.setView(route.path[0], 11);
                }
                document.getElementById('info-panel').innerHTML = `
                    <strong>Active Route View:</strong> ${route.routeTitle}<br>
                    <strong>Path & Stops:</strong> Highlighted on map in bright color.<br>
                    <strong>Official Timetable Link:</strong> <a href="${route.pdfUrl}" target="_blank">View County PDF Documentation</a>
                `;
            } else {
                map.setView([DEFAULT_LAT, DEFAULT_LON], 10);
                document.getElementById('info-panel').innerHTML = `<strong>Transit Info:</strong> Showing all active routes, colored path lines, and connecting transfer points across the island.`;
            }
        }

        function clearMapOverlays() {
            busMarkers.forEach(m => map.removeLayer(m));
            busMarkers = [];
            routePolylines.forEach(p => map.removeLayer(p));
            routePolylines = [];
        }

        function toggleOfflineMode() {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            const next = current === 'disabled' ? 'enabled' : 'disabled';
            localStorage.setItem('heleon_cache_mode', next);
            updateCacheButtonStyle(next);
        }

        function updateCacheButtonStyle(mode) {
            const btn = document.getElementById('cache-btn');
            if (mode === 'enabled') {
                btn.innerText = "Cache Mode: ON";
                btn.classList.add('cache-active');
            } else {
                btn.innerText = "Cache Mode: OFF";
                btn.classList.remove('cache-active');
            }
        }

        function checkServiceAlerts() {
            const alertsBar = document.getElementById('alerts-bar');
            const alertText = document.getElementById('alert-text');
            const activeNotice = "County Mass Transit fixed routes and connection hubs operational.";

            if (activeNotice) {
                alertText.innerText = activeNotice;
                alertsBar.style.display = 'block';
            } else {
                alertsBar.style.display = 'none';
            }
        }
    </script>
</body>
</html>
