<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Live Feed Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; line-height: 1.5; }
        h1 { font-size: 1.25rem; margin-bottom: 12px; color: #38bdf8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        select, button { width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        select { background: #334155; color: #fff; border: 1px solid #475569; }
        button { background: #2563eb; color: #fff; }
        button:active { background: #1d4ed8; }
        .status-box { font-size: 0.9rem; color: #4ade80; background: #064e3b; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #065f46; }
        .route-info { font-size: 0.95rem; color: #cbd5e1; }
        .timestamp { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>Hele-On Mobile Live Viewer</h1>

    <div class="card">
        <label for="route-select" style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 4px;">SELECT ROUTE:</label>
        <select id="route-select">
            <option value="402">Route 402: Puna / Makuū / HPP</option>
            <option value="401">Route 401: Hawaiian Beaches / Pahoa</option>
            <option value="40">Route 40: Hilo to Pahoa</option>
            <option value="11">Route 11: Hilo to Volcano</option>
            <option value="1">Route 1: Hilo to Kona</option>
        </select>
        <button onclick="fetchLiveFeed()">Check Live Status</button>
    </div>

    <div id="status-display" class="status-box">Status: Ready to query live feed.</div>

    <div id="results-container">
        <div class="card">
            <div class="route-info">Select a route above and tap check live status to load active vehicle data directly from the network feed.</div>
        </div>
    </div>

    <script>
        async function fetchLiveFeed() {
            const routeId = document.getElementById('route-select').value;
            const statusBox = document.getElementById('status-display');
            const container = document.getElementById('results-container');
            
            statusBox.style.background = '#1e3a8a';
            statusBox.style.color = '#93c5fd';
            statusBox.style.borderColor = '#1d4ed8';
            statusBox.textContent = `Connecting to live Hele-On data for Route ${routeId}...`;
            container.innerHTML = '';

            try {
                // Querying the public transit endpoint JSON directory structure
                const response = await fetch('https://myheleonbus.org/bustime/map/getbuses.jsp?route=' + routeId);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const textData = await response.text();
                
                statusBox.style.background = '#064e3b';
                statusBox.style.color = '#4ade80';
                statusBox.style.borderColor = '#065f46';
                statusBox.textContent = 'Live data successfully retrieved.';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="font-weight: bold; color: #38bdf8; margin-bottom: 6px;">Route ${routeId} Feed Response</div>
                    <div class="route-info" style="word-break: break-all; font-family: monospace; font-size: 0.8rem; background: #0f172a; padding: 8px; border-radius: 4px; max-height: 200px; overflow-y: auto;">
                        ${escapeHtml(textData || "No active vehicles currently reporting on this route feed.")}
                    </div>
                    <div class="timestamp">Fetched at: ${new Date().toLocaleTimeString()}</div>
                `;
                container.appendChild(card);

            } catch (err) {
                statusBox.style.background = '#7f1d1d';
                statusBox.style.color = '#fca5a5';
                statusBox.style.borderColor = '#991b1b';
                statusBox.textContent = 'Connection Blocked or Network Error.';
                
                container.innerHTML = `
                    <div class="card">
                        <div class="route-info" style="color: #fca5a5;">
                            Mobile browser security (CORS) prevented a direct script fetch from the live URL. 
                            <br><br>
                            To check it instantly without blocks, you can open the official mobile page directly:
                        </div>
                        <a href="https://www.myheleonbus.org/" target="_blank" style="display: block; margin-top: 10px; background: #2563eb; color: #fff; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold;">Open Official Mobile Portal</a>
                    </div>
                `;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
