<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Complete Island Transit Tracker</title>
    <!-- Leaflet CSS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #e0e0e0; }
        #controls { padding: 10px; background: #1e1e1e; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #333; align-items: center; }
        button, select { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        select { background: #2a2a2a; border: 1px solid #444; max-width: 280px; }
        button:hover, select:hover { background: #1d4ed8; }
        button.cache-active { background: #16a34a; }
        #status { font-size: 0.85rem; color: #aaa; margin-left: auto; }
        #alerts-bar { background: #854d0e; color: #fef08a; padding: 8px 10px; font-size: 0.85rem; display: none; border-bottom: 1px solid #713f12; }
        #map { flex: 1; width: 100%; background: #242424; }
        #info-panel { background: #1e1e1e; padding: 12px; border-top: 1px solid #333; font-size: 0.9rem; max-height: 160px; overflow-y: auto; line-height: 1.4; }
        #info-panel a { color: #60a5fa; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="controls">
        <select id="route-select" onchange="filterRouteSchedule()">
            <option value="all">-- View All Island Routes --</option>
            <option value="route-1">Route 1: Hilo to Kailua-Kona</option>
            <option value="route-2">Route 2 (Blue Line): Hilo / Kona via Saddle</option>
            <option value="route-10">Route 10: Hilo to Ocean View</option>
            <option value="route-11">Route 11 (Red Line): Hilo to Volcano</option>
            <option value="route-40">Route 40: Hilo to Pahoa</option>
            <option value="route-80">Route 80: Hilo to South Kohala Resorts</option>
            <option value="route-101">Route 101: Intra-Hilo Keaukaha</option>
            <option value="route-102">Route 102: Intra-Hilo Kaumana</option>
            <option value="route-103">Route 103: Intra-Hilo Waiakea Uka</option>
            <option value="route-104">Route 104: Intra-Hilo Mohouli</option>
            <option value="route-401">Route 401: Hawaiian Beaches / Puna</option>
            <option value="route-402">Route 402: Hawaiian Paradise Park / Ainaloa</option>
            <option value="route-201">Route 201: Kona Trolley / Alii Drive</option>
            <option value="route-202">Route 202: Central Kailua-Kona</option>
        </select>
        <button onclick="fetchLiveBuses()">Reload Network</button>
        <button onclick="locateUser()">Locate Me</button>
        <button id="cache-btn" onclick="toggleOfflineMode()">Cache Mode: OFF</button>
        <span id="status">Status: Ready</span>
    </div>

    <div id="alerts-bar"><strong>Service Alert:</strong> <span id="alert-text">Checking for notices...</span></div>

    <div id="map"></div>

    <div id="info-panel">
        <strong>Transit Info:</strong> Select any specific route from the drop-down menu above or tap any official stop marker on the map to view timetable details, stop IDs, walking estimates, and official county PDF links.
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const DEFAULT_LAT = 19.7241;
        const DEFAULT_LON = -155.0868;

        const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], 10);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
        }).addTo(map);

        let userMarker = null;
        let busMarkers = [];
        let userCoords = null;

        // Comprehensive dataset covering the complete County of Hawai'i Hele-On network
        const heleOnRoutesData = [
            // Route 1: Hilo to Kailua-Kona
            { id: 'route-1', name: 'Moʻoheau Bus Terminal (Hilo Origin)', lat: 19.7215, lng: -155.0847, routeTitle: 'Route 1: Hilo to Kailua-Kona', schedule: 'Main Terminal Departure Hub', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-1', name: 'Loloku Street Park and Ride (Kona)', lat: 19.6400, lng: -155.9969, routeTitle: 'Route 1: Hilo to Kailua-Kona', schedule: 'Kailua-Kona Terminal Hub', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Route 2: Blue Line (Hilo / Kona via Saddle)
            { id: 'route-2', name: 'Moʻoheau Bus Terminal (Blue Line Start)', lat: 19.7215, lng: -155.0847, routeTitle: 'Route 2 (Blue Line): Hilo / Kona via Saddle', schedule: 'Cross-island via Daniel K. Inouye Hwy', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-2', name: 'Kona International Airport (KOA)', lat: 19.7388, lng: -156.0456, routeTitle: 'Route 2 (Blue Line): Hilo / Kona via Saddle', schedule: 'Airport Terminal Stop', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Route 10: Hilo to Ocean View
            { id: 'route-10', name: 'Moʻoheau Bus Terminal (Route 10)', lat: 19.7215, lng: -155.0847, routeTitle: 'Route 10: Hilo to Ocean View', schedule: 'Southbound via Volcano & Naalehu', pdfUrl: 'https://www.heleonbus.hawaiicounty.gov/getting-around/bus-schedules-and-maps/east-hawai-i/route-10-hilo-to-ocean-view', status: 'Active' },
            { id: 'route-10', name: 'Prince Kuhiō Plaza Shelter', lat: 19.6880, lng: -155.0810, routeTitle: 'Route 10: Hilo to Ocean View', schedule: 'Ohu Ohu St Stop', pdfUrl: 'https://www.heleonbus.hawaiicounty.gov/getting-around/bus-schedules-and-maps/east-hawai-i/route-10-hilo-to-ocean-view', status: 'Active' },
            { id: 'route-10', name: 'Volcano General Store', lat: 19.4310, lng: -155.2320, routeTitle: 'Route 10: Hilo to Ocean View', schedule: 'Old Volcano Rd @ Wright Rd', pdfUrl: 'https://www.heleonbus.hawaiicounty.gov/getting-around/bus-schedules-and-maps/east-hawai-i/route-10-hilo-to-ocean-view', status: 'Active' },
            { id: 'route-10', name: 'Naalehu Civic Center', lat: 19.0640, lng: -155.5840, routeTitle: 'Route 10: Hilo to Ocean View', schedule: 'Naalehu Town Hub', pdfUrl: 'https://www.heleonbus.hawaiicounty.gov/getting-around/bus-schedules-and-maps/east-hawai-i/route-10-hilo-to-ocean-view', status: 'Active' },

            // Route 11: Red Line (Hilo to Volcano)
            { id: 'route-11', name: 'Moʻoheau Bus Terminal (Route 11)', lat: 19.7215, lng: -155.0847, routeTitle: 'Route 11 (Red Line): Hilo to Volcano', schedule: 'Direct Hilo-Volcano Corridor', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-11', name: 'Hawaii Volcanoes National Park Visitor Center', lat: 19.4284, lng: -155.2558, routeTitle: 'Route 11 (Red Line): Hilo to Volcano', schedule: 'Crater Rim Drive Terminal', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Route 40: Hilo to Pahoa
            { id: 'route-40', name: 'Moʻoheau Bus Terminal (Route 40)', lat: 19.7215, lng: -155.0847, routeTitle: 'Route 40: Hilo to Pahoa', schedule: 'Connects Hilo, Keaʻau, and Pāhoa', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-40', name: 'Old Volcano Road @ Milo Street (Keaʻau)', lat: 19.6235, lng: -155.0380, routeTitle: 'Route 40: Hilo to Pahoa', schedule: 'Keaʻau Village Hub', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-40', name: 'Puna Kai Shopping Center (Pahoa)', lat: 19.5000, lng: -154.9800, routeTitle: 'Route 40: Hilo to Pahoa', schedule: 'Pahoa Village Road Stop', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Route 80: Hilo to South Kohala Resorts
            { id: 'route-80', name: 'Moʻoheau Bus Terminal (Route 80)', lat: 19.7215, lng: -155.0847, routeTitle: 'Route 80: Hilo to South Kohala Resorts', schedule: 'North via Hamakua & Waimea', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-80', name: 'Hilton Waikoloa Village Resort', lat: 19.9250, lng: -155.8750, routeTitle: 'Route 80: Hilo to South Kohala Resorts', schedule: 'Waikoloa Beach Drive', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Intra-Hilo Routes (101, 102, 103, 104)
            { id: 'route-101', name: 'Route 101: Keaukaha / Richardson Beach', lat: 19.7300, lng: -155.0500, routeTitle: 'Route 101: Intra-Hilo Keaukaha', schedule: 'Beach Parks & Airport Corridor', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-102', name: 'Route 102: Kaumana Drive Stop', lat: 19.7150, lng: -155.1100, routeTitle: 'Route 102: Intra-Hilo Kaumana', schedule: 'Kaumana Ave Residential Line', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-103', name: 'Route 103: Waiakea Uka / UH Hilo', lat: 19.7050, lng: -155.0750, routeTitle: 'Route 103: Intra-Hilo Waiakea Uka', schedule: 'University & Campus Area Loop', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-104', name: 'Route 104: Mohouli Street Stop', lat: 19.7000, lng: -155.0950, routeTitle: 'Route 104: Intra-Hilo Mohouli', schedule: 'West Hilo Residential Link', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Puna Local Feeders (401, 402)
            { id: 'route-401', name: 'Route 401: Hawaiian Beaches / Nanawale', lat: 19.4850, lng: -154.9300, routeTitle: 'Route 401: Hawaiian Beaches / Puna', schedule: 'Pahoa - Nanawale - Seaview Loop', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-402', name: 'Route 402: Hawaiian Paradise Park / Ainaloa', lat: 19.5500, lng: -154.9850, routeTitle: 'Route 402: Hawaiian Paradise Park / Ainaloa', schedule: 'Puna Subdivision Feeder Route', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },

            // Kona Local Lines (201, 202)
            { id: 'route-201', name: 'Route 201: Kona Trolley / Alii Drive', lat: 19.6300, lng: -155.9900, routeTitle: 'Route 201: Kona Trolley / Alii Drive', schedule: 'Keauhou Shopping Center to Kailua Village', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' },
            { id: 'route-202', name: 'Route 202: Central Kailua-Kona', lat: 19.6420, lng: -155.9950, routeTitle: 'Route 202: Central Kailua-Kona', schedule: 'Kona Town Commercial Loop', pdfUrl: 'https://www.hawaiicounty.gov/departments/mass-transit/bus-schedules-maps', status: 'Active' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            updateCacheButtonStyle(current);
            checkServiceAlerts();
            
            if (!localStorage.getItem('heleon_cached_bus_data')) {
                localStorage.setItem('heleon_cached_bus_data', JSON.stringify(heleOnRoutesData));
            }
            fetchLiveBuses();
        });

        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        function locateUser() {
            document.getElementById('status').innerText = 'Status: Locating...';
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    userCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.marker([userCoords.lat, userCoords.lng])
                        .addTo(map)
                        .bindPopup("<b>You are here</b>")
                        .openPopup();

                    map.setView([userCoords.lat, userCoords.lng], 13);
                    document.getElementById('status').innerText = 'Status: Position Located';
                }, error => {
                    document.getElementById('status').innerText = 'Status: GPS Failed';
                    alert('Unable to acquire location. Check browser location permissions.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }

        function getWalkTimeEstimate(targetLat, targetLng) {
            if (!userCoords) return "Locate yourself via button above for walk time estimates.";

            const R = 3958.8;
            const dLat = (targetLat - userCoords.lat) * Math.PI / 180;
            const dLon = (targetLng - userCoords.lng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(userCoords.lat * Math.PI / 180) * Math.cos(targetLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            const walkSpeedMph = 3.0;
            const timeMinutes = Math.round((distance / walkSpeedMph) * 60);

            return `${distance.toFixed(2)} mi away (~${timeMinutes} min walk at 3mph)`;
        }

        function fetchLiveBuses() {
            document.getElementById('status').innerText = 'Status: Loading stops...';
            clearBusMarkers();

            const cachedData = localStorage.getItem('heleon_cached_bus_data');
            if (cachedData) {
                const stops = JSON.parse(cachedData);
                renderStops(stops);
                document.getElementById('status').innerText = `Status: Loaded (${stops.length} official stops)`;
            } else {
                alert('No schedule data found.');
            }
        }

        function renderStops(stops) {
            stops.forEach(stop => {
                const walkEstimate = getWalkTimeEstimate(stop.lat, stop.lng);
                const marker = L.marker([stop.lat, stop.lng], { icon: busIcon })
                    .addTo(map)
                    .bindPopup(`<b>${stop.name}</b><br>${stop.routeTitle}<br>Schedule: ${stop.schedule}<br>${walkEstimate}`);
                
                marker.on('click', () => {
                    document.getElementById('info-panel').innerHTML = `
                        <strong>Stop Location:</strong> ${stop.name}<br>
                        <strong>Route:</strong> ${stop.routeTitle}<br>
                        <strong>Timetable Details:</strong> ${stop.schedule}<br>
                        <strong>Your Distance:</strong> ${getWalkTimeEstimate(stop.lat, stop.lng)}<br>
                        <strong>Official County PDF:</strong> <a href="${stop.pdfUrl}" target="_blank">Open Schedule Document</a>
                    `;
                });

                busMarkers.push(marker);
            });
        }

        function filterRouteSchedule() {
            const selectedRoute = document.getElementById('route-select').value;
            clearBusMarkers();

            const cachedData = JSON.parse(localStorage.getItem('heleon_cached_bus_data') || '[]');
            const filtered = selectedRoute === 'all' 
                ? cachedData 
                : cachedData.filter(s => s.id === selectedRoute);

            renderStops(filtered);

            if (selectedRoute !== 'all' && filtered.length > 0) {
                map.setView([filtered[0].lat, filtered[0].lng], 11);
                document.getElementById('info-panel').innerHTML = `
                    <strong>Active Route View:</strong> ${filtered[0].routeTitle}<br>
                    <strong>Loaded Stops:</strong> ${filtered.length} official waypoints mapped.<br>
                    <strong>Official Timetable Link:</strong> <a href="${filtered[0].pdfUrl}" target="_blank">View County PDF Documentation</a>
                `;
            } else {
                document.getElementById('info-panel').innerHTML = `<strong>Transit Info:</strong> Showing all active system routes across the island network.`;
            }
        }

        function clearBusMarkers() {
            busMarkers.forEach(m => map.removeLayer(m));
            busMarkers = [];
        }

        function toggleOfflineMode() {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            const next = current === 'disabled' ? 'enabled' : 'disabled';
            localStorage.setItem('heleon_cache_mode', next);
            updateCacheButtonStyle(next);
        }

        function updateCacheButtonStyle(mode) {
            const btn = document.getElementById('cache-btn');
            if (mode === 'enabled') {
                btn.innerText = "Cache Mode: ON";
                btn.classList.add('cache-active');
            } else {
                btn.innerText = "Cache Mode: OFF";
                btn.classList.remove('cache-active');
            }
        }

        function checkServiceAlerts() {
            const alertsBar = document.getElementById('alerts-bar');
            const alertText = document.getElementById('alert-text');
            const activeNotice = "County Mass Transit fixed routes operational across East Hawaiʻi, Puna, and West Hawaiʻi.";

            if (activeNotice) {
                alertText.innerText = activeNotice;
                alertsBar.style.display = 'block';
            } else {
                alertsBar.style.display = 'none';
            }
        }
    </script>
</body>
</html>
