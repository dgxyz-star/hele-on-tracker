<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hele-On Mini Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        
        /* Compact Header optimized for narrow Tank Mini screen */
        header { background: #1e293b; padding: 8px 10px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; z-index: 1000; }
        h1 { font-size: 0.95rem; color: #38bdf8; text-align: center; }
        .controls { display: flex; width: 100%; }
        select { width: 100%; background: #334155; color: #fff; border: 1px solid #475569; padding: 6px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        
        #map { flex: 1; width: 100%; background: #0f172a; z-index: 1; }
        
        /* Compact Popup Styling for Small Screens */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b !important; color: #f8fafc !important; border: 1px solid #475569; border-radius: 6px; }
        .leaflet-popup-content { font-size: 0.8rem; line-height: 1.3; margin: 8px; }
        .popup-stop-name { font-weight: bold; color: #38bdf8; font-size: 0.85rem; margin-bottom: 2px; display: block; }
        .popup-stop-meta { font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
        .popup-times-title { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; margin-bottom: 2px; }
        .popup-times-list { list-style-type: none; padding-left: 0; max-height: 90px; overflow-y: auto; }
        .popup-times-list li { background: #0f172a; padding: 3px 5px; margin-bottom: 2px; border-radius: 3px; font-family: monospace; font-size: 0.75rem; color: #4ade80; }
        
        /* Halved GPS & Stop Marker sizing */
        .user-loc-dot { background: #2563eb; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 6px rgba(37, 99, 235, 0.8); }
    </style>
</head>
<body>

    <header>
        <h1>Hele-On Mini Map</h1>
        <div class="controls">
            <select id="route-select" onchange="loadRouteOnMap()">
                <option value="hpp-paradise">HPP: Paradise Drive Corridor</option>
                <option value="hilo-volcano">Route 11: Hilo to Volcano (Official Stops)</option>
                <option value="hilo-kona">Route 1: Hilo to Kona Hubs</option>
                <option value="hilo-pahoa">Route 40: Hilo to Pahoa</option>
            </select>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map centered over East Hawaii / HPP
        const map = L.map('map').setView([19.5750, -154.9600], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let userMarker = null;

        // Master Database enriched with official stops.txt data and local corridor points[cite: 4]
        const networkDatabase = {
            'hpp-paradise': {
                name: 'Paradise Drive Corridor',
                stops: [
                    { name: 'Paradise Drive & 1st Ave', stop_id: 189, type: 'Westbound flag stop', lat: 19.603062, lng: -154.948458, times: ['06:00 AM', '08:00 AM', '02:00 PM'] },
                    { name: 'Paradise Drive & 9th Ave', stop_id: 191, type: 'Westbound flag stop', lat: 19.591684, lng: -154.958734, times: ['06:04 AM', '08:04 AM', '02:04 PM'] },
                    { name: 'Paradise Drive & 18th Ave', stop_id: 198, type: 'Westbound flag stop', lat: 19.578791, lng: -154.970392, times: ['06:10 AM', '08:10 AM', '02:10 PM'] },
                    { name: 'Paradise Drive & 31st Ave', stop_id: 178, stop_code: 931, type: 'Mailbox flag stop', lat: 19.560148, lng: -154.987286, times: ['06:18 AM', '08:18 AM', '02:18 PM'] }
                ]
            },
            'hilo-volcano': {
                name: 'Route 11: Hilo to Volcano',
                stops: [
                    { name: "Mo'oheau Bus Terminal", stop_id: 1, stop_code: 100, type: 'Terminal hub[cite: 4]', lat: 19.724013, lng: -155.084657, times: ['05:00 AM', '07:30 AM', '12:00 PM'] },
                    { name: "Kurtistown Park / Hwy 11", stop_id: 13, stop_code: 903, type: 'Flag stop[cite: 4]', lat: 19.591883, lng: -155.059193, times: ['05:35 AM', '08:05 AM', '12:35 PM'] },
                    { name: "Mountain View (Frankie's)", stop_id: 14, stop_code: 911, type: 'Roadside flag stop[cite: 4]', lat: 19.551349, lng: -155.106792, times: ['05:50 AM', '08:20 AM', '12:50 PM'] },
                    { name: "Volcano Village Post Office", stop_id: 17, stop_code: 916, type: 'Flag stop[cite: 4]', lat: 19.427889, lng: -155.236028, times: ['06:15 AM', '08:45 AM', '01:15 PM'] },
                    { name: "HVNP Visitors Center", stop_id: 19, stop_code: 809, type: 'Park flag stop ($15 fee)[cite: 4]', lat: 19.429472, lng: -155.257306, times: ['06:25 AM', '08:55 AM', '01:25 PM'] }
                ]
            },
            'hilo-kona': {
                name: 'Route 1: Hilo to Kona',
                stops: [
                    { name: "Mo'oheau Bus Terminal", stop_id: 1, stop_code: 100, type: 'Terminal hub[cite: 4]', lat: 19.724013, lng: -155.084657, times: ['04:45 AM', '08:15 AM', '01:30 PM'] },
                    { name: "Waimea Parker Ranch Center", stop_id: 36, stop_code: 422, type: 'Bus shelter[cite: 4]', lat: 20.021564, lng: -155.665946, times: ['06:00 AM', '09:30 AM', '02:45 PM'] },
                    { name: "Kona Courtyard Marriott / Palani", stop_id: 80, stop_code: 650, type: 'Southbound stop[cite: 4]', lat: 19.640312, lng: -155.996855, times: ['08:00 AM', '11:30 AM', '04:45 PM'] }
                ]
            },
            'hilo-pahoa': {
                name: 'Route 40: Hilo to Pahoa',
                stops: [
                    { name: "Mo'oheau Bus Terminal", stop_id: 1, stop_code: 100, type: 'Terminal hub[cite: 4]', lat: 19.724013, lng: -155.084657, times: ['06:15 AM', '09:30 AM', '03:45 PM'] },
                    { name: "Kea'au Village Hub / Post Office", stop_id: 25, stop_code: 924, type: 'Hub stop[cite: 4]', lat: 19.621512, lng: -155.039946, times: ['06:40 AM', '09:55 AM', '04:10 PM'] }
                ]
            }
        };

        function loadRouteOnMap() {
            const routeId = document.getElementById('route-select').value;
            const routeData = networkDatabase[routeId];
            
            markersLayer.clearLayers();
            if (!routeData) return;

            let latLngs = [];

            routeData.stops.forEach((stop, index) => {
                latLngs.push([stop.lat, stop.lng]);

                let stopMeta = '';
                if (stop.stop_id) stopMeta += `Stop ID: ${stop.stop_id} `;
                if (stop.stop_code) stopMeta += `(Code: ${stop.stop_code}) `;
                if (stop.type) stopMeta += `<br>${stop.type}`;

                let timesHtml = stop.times ? stop.times.map(t => `<li>${t}</li>`).join('') : '';
                let popupContent = `
                    <span class="popup-stop-name">${index + 1}. ${stop.name}</span>
                    <div class="popup-stop-meta">${stopMeta}</div>
                    ${timesHtml ? '<div class="popup-times-title">Schedule:</div><ul class="popup-times-list">' + timesHtml + '</ul>' : ''}
                `;

                // Custom small icon configuration (halved standard dimensions)
                let smallIcon = L.icon({
                    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                    iconSize: [12, 20],      // Halved from 25x41
                    iconAnchor: [6, 20],     // Halved anchor
                    popupAnchor: [0, -15],
                    shadowSize: [20, 20]
                });

                let marker = L.marker([stop.lat, stop.lng], { icon: smallIcon }).bindPopup(popupContent);
                markersLayer.addLayer(marker);
            });

            if (latLngs.length > 0) {
                map.fitBounds(latLngs, { padding: [30, 30] });
            }
        }

        // GPS Tracker with scaled down dot element
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(position => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                if (!userMarker) {
                    let userIcon = L.divIcon({
                        className: 'user-loc-dot',
                        iconSize: [10, 10],   // Halved from 16x16
                        iconAnchor: [5, 5]
                    });
                    userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup("<b>You are here</b>");
                } else {
                    userMarker.setLatLng([userLat, userLng]);
                }
            }, error => {
                console.log("GPS Location unavailable: ", error.message);
            }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }

        loadRouteOnMap();
    </script>
</body>
</html>
