<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hele-On GTFS Viewer</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        
        header { background: #1e293b; padding: 6px 8px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 4px; z-index: 1000; }
        h1 { font-size: 0.9rem; color: #38bdf8; text-align: center; }
        .controls-row { display: flex; gap: 4px; width: 100%; }
        select { flex: 1; background: #334155; color: #fff; border: 1px solid #475569; padding: 5px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        
        #map { flex: 1; width: 100%; background: #0f172a; z-index: 1; }
        
        /* Popup Styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b !important; color: #f8fafc !important; border: 1px solid #475569; border-radius: 6px; }
        .leaflet-popup-content { font-size: 0.75rem; line-height: 1.3; margin: 8px; }
        .popup-stop-name { font-weight: bold; color: #38bdf8; font-size: 0.8rem; margin-bottom: 2px; display: block; }
        .popup-stop-meta { font-size: 0.65rem; color: #94a3b8; margin-bottom: 4px; }
        .popup-times-title { font-size: 0.6rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; margin-bottom: 2px; font-weight: bold; }
        .popup-times-list { list-style-type: none; padding-left: 0; max-height: 80px; overflow-y: auto; }
        .popup-times-list li { background: #0f172a; padding: 2px 4px; margin-bottom: 2px; border-radius: 3px; font-family: monospace; font-size: 0.7rem; color: #4ade80; }
        .no-service { color: #f43f5e !important; font-style: italic; }
        
        .user-loc-dot { background: #2563eb; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 6px rgba(37, 99, 235, 0.8); }
    </style>
</head>
<body>

    <header>
        <h1>Hele-On GTFS Viewer</h1>
        <div class="controls-row">
            <select id="route-select" onchange="renderRoute()"><option value="">Loading routes...</option></select>
            <select id="day-select" onchange="renderRoute()">
                <option value="weekday">Mon - Fri</option>
                <option value="saturday">Saturday</option>
                <option value="sunday">Sunday / Holiday</option>
            </select>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const map = L.map('map').setView([19.5750, -154.9600], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let userMarker = null;

        let gtfsData = {
            routes: {}, // route_id -> route name
            trips: {},  // trip_id -> { route_id, service_id }
            stops: {},  // stop_id -> { name, lat, lng, code }
            stopTimes: {} // trip_id -> [{ stop_id, arrival_time }]
        };

        // Simple robust CSV parser handling quotes and commas
        function parseCSV(text) {
            let lines = text.trim().split(/\r\n|\n/);
            if (lines.length === 0) return [];
            let headers = parseCSVLine(lines[0]);
            let result = [];
            for (let i = 1; i < lines.length; i++) {
                let data = parseCSVLine(lines[i]);
                if (data.length === headers.length) {
                    let obj = {};
                    for (let j = 0; j < headers.length; j++) {
                        obj[headers[j]] = data[j];
                    }
                    result.push(obj);
                }
            }
            return result;
        }

        function parseCSVLine(line) {
            let res = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    res.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            res.push(current.trim());
            return res;
        }

        // Load and parse GTFS text files stored in the same local directory
        async function loadGTFSData() {
            try {
                const [routesText, stopsText, tripsText, stopTimesText] = await Promise.all([
                    fetch('routes.txt').then(r => r.text()),
                    fetch('stops.txt').then(r => r.text()),
                    fetch('trips.txt').then(r => r.text()),
                    fetch('stop_times.txt').then(r => r.text())
                ]);

                // Parse Routes
                parseCSV(routesText).forEach(row => {
                    let rId = row.route_id;
                    let rName = row.route_short_name ? `${row.route_short_name}: ${row.route_long_name}` : row.route_long_name;
                    gtfsData.routes[rId] = rName;
                });

                // Parse Stops
                parseCSV(stopsText).forEach(row => {
                    gtfsData.stops[row.stop_id] = {
                        name: row.stop_name,
                        lat: parseFloat(row.stop_lat),
                        lng: parseFloat(row.stop_lon),
                        code: row.stop_code || row.stop_id
                    };
                });

                // Parse Trips
                parseCSV(tripsText).forEach(row => {
                    gtfsData.trips[row.trip_id] = {
                        route_id: row.route_id,
                        service_id: row.service_id
                    };
                });

                // Parse Stop Times
                parseCSV(stopTimesText).forEach(row => {
                    if (!gtfsData.stopTimes[row.trip_id]) {
                        gtfsData.stopTimes[row.trip_id] = [];
                    }
                    gtfsData.stopTimes[row.trip_id].push({
                        stop_id: row.stop_id,
                        time: row.arrival_time || row.departure_time
                    });
                });

                populateRouteDropdown();
            } catch (err) {
                console.error("Error loading GTFS files:", err);
                document.getElementById('route-select').innerHTML = '<option>Error: Place GTFS .txt files in folder</option>';
            }
        }

        function populateRouteDropdown() {
            const select = document.getElementById('route-select');
            select.innerHTML = '';
            
            let sortedRoutes = Object.keys(gtfsData.routes).map(id => ({ id, name: gtfsData.routes[id] }));
            sortedRoutes.sort((a, b) => a.name.localeCompare(b.name));

            sortedRoutes.forEach(r => {
                let opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.name;
                select.appendChild(opt);
            });

            // Auto-select current day in dropdown
            const jsDay = new Date().getDay();
            document.getElementById('day-select').value = (jsDay === 0) ? 'sunday' : (jsDay === 6) ? 'saturday' : 'weekday';

            if (sortedRoutes.length > 0) {
                renderRoute();
            }
        }

        function renderRoute() {
            const routeId = document.getElementById('route-select').value;
            const dayType = document.getElementById('day-select').value;
            markersLayer.clearLayers();
            if (!routeId) return;

            // Find all unique stops used by trips matching this route and day type
            let activeStopsMap = {}; // stop_id -> Set of times

            Object.keys(gtfsData.trips).forEach(tripId => {
                let trip = gtfsData.trips[tripId];
                if (trip.route_id === routeId) {
                    // Simple heuristic matching service_id strings for weekdays/weekends
                    let sId = trip.service_id.toLowerCase();
                    let isMatch = false;
                    if (dayType === 'weekday' && (sId.includes('week') || sId.includes('mon') || sId.includes('wd'))) isMatch = true;
                    if (dayType === 'saturday' && (sId.includes('sat') || sId.includes('we'))) isMatch = true;
                    if (dayType === 'sunday' && (sId.includes('sun') || sId.includes('hol') || sId.includes('we'))) isMatch = true;
                    // Fallback if service naming scheme doesn't match standard abbreviations
                    if (!isMatch && Object.keys(gtfsData.trips).length < 500) isMatch = true; 

                    if (isMatch && gtfsData.stopTimes[tripId]) {
                        gtfsData.stopTimes[tripId].forEach(st => {
                            if (!activeStopsMap[st.stop_id]) {
                                activeStopsMap[st.stop_id] = new Set();
                            }
                            if (st.time) activeStopsMap[st.stop_id].add(st.time.substring(0, 5)); // HH:MM format
                        });
                    }
                }
            });

            let latLngs = [];

            Object.keys(activeStopsMap).forEach(stopId => {
                let stopInfo = gtfsData.stops[stopId];
                if (stopInfo && !isNaN(stopInfo.lat) && !isNaN(stopInfo.lng)) {
                    latLngs.push([stopInfo.lat, stopInfo.lng]);

                    let timesArr = Array.from(activeStopsMap[stopId]).sort();
                    let timesHtml = timesArr.length > 0 ? 
                        '<div class="popup-times-title">Times:</div><ul class="popup-times-list">' + timesArr.map(t => `<li>${t}</li>`).join('') + '</ul>' : 
                        '<div class="popup-times-title">Times:</div><p class="no-service">No times listed.</p>';

                    let popupContent = `
                        <span class="popup-stop-name">${stopInfo.name}</span>
                        <div class="popup-stop-meta">Stop Code: ${stopInfo.code}</div>
                        ${timesHtml}
                    `;

                    let smallIcon = L.icon({
                        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                        iconSize: [12, 20],
                        iconAnchor: [6, 20],
                        popupAnchor: [0, -15],
                        shadowSize: [20, 20]
                    });

                    let marker = L.marker([stopInfo.lat, stopInfo.lng], { icon: smallIcon }).bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                }
            });

            if (latLngs.length > 0) {
                map.fitBounds(latLngs, { padding: [30, 30] });
            }
        }

        // GPS Tracker
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(position => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                if (!userMarker) {
                    let userIcon = L.divIcon({ className: 'user-loc-dot', iconSize: [10, 10], iconAnchor: [5, 5] });
                    userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup("<b>You are here</b>");
                } else {
                    userMarker.setLatLng([userLat, userLng]);
                }
            }, null, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }

        // Kick off loading process
        loadGTFSData();
    </script>
</body>
</html>
