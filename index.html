<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Offline/Low-Data Tracker</title>
    <!-- Leaflet CSS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #e0e0e0; }
        #controls { padding: 10px; background: #1e1e1e; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #333; align-items: center; }
        button { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button.cache-active { background: #16a34a; }
        #status { font-size: 0.85rem; color: #aaa; margin-left: auto; }
        #alerts-bar { background: #854d0e; color: #fef08a; padding: 8px 10px; font-size: 0.85rem; display: none; border-bottom: 1px solid #713f12; }
        #map { flex: 1; width: 100%; background: #242424; }
        #info-panel { background: #1e1e1e; padding: 10px; border-top: 1px solid #333; font-size: 0.9rem; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="fetchLiveBuses()">Load Stops & Simulation</button>
        <button onclick="locateUser()">Locate Me</button>
        <button id="cache-btn" onclick="toggleOfflineMode()">Cache Mode: OFF</button>
        <span id="status">Status: Ready</span>
    </div>

    <div id="alerts-bar"><strong>Service Alert:</strong> <span id="alert-text">Checking for notices...</span></div>

    <div id="map"></div>

    <div id="info-panel">
        <strong>Transit Info:</strong> Select a bus stop or marker to view walking estimates and route updates.
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Default focus center: Big Island / Hilo area
        const DEFAULT_LAT = 19.7241;
        const DEFAULT_LON = -155.0868;

        const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], 11);

        // Esri World Gray Canvas tiles (completely open, no API key required)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
        }).addTo(map);

        let userMarker = null;
        let busMarkers = [];
        let userCoords = null;

        // Initialize state on load
        window.addEventListener('DOMContentLoaded', () => {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            updateCacheButtonStyle(current);
            checkServiceAlerts();
            // Pre-seed local storage default mock data so it works instantly offline
            const staticStops = [
                { id: 'puna-1', route: 'Puna/Hilo Express Route (Simulated)', lat: 19.6500, lng: -155.0300, updated: 'Static Baseline' },
                { id: 'volcano-1', route: 'Volcano/Kona Connector (Simulated)', lat: 19.5200, lng: -155.2000, updated: 'Static Baseline' }
            ];
            if (!localStorage.getItem('heleon_cached_bus_data')) {
                localStorage.setItem('heleon_cached_bus_data', JSON.stringify(staticStops));
            }
        });

        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        // Track User GPS Position
        function locateUser() {
            document.getElementById('status').innerText = 'Status: Locating...';
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    userCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.marker([userCoords.lat, userCoords.lng])
                        .addTo(map)
                        .bindPopup("<b>You are here</b>")
                        .openPopup();

                    map.setView([userCoords.lat, userCoords.lng], 14);
                    document.getElementById('status').innerText = 'Status: Position Located';
                }, error => {
                    document.getElementById('status').innerText = 'Status: GPS Failed';
                    alert('Unable to acquire location. Check browser site permissions for location access.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }

        // Calculate straight-line distance (Haversine formula) and estimate walk time
        function getWalkTimeEstimate(targetLat, targetLng) {
            if (!userCoords) return "Locate yourself to estimate walk time.";

            const R = 3958.8; // Radius of Earth in miles
            const dLat = (targetLat - userCoords.lat) * Math.PI / 180;
            const dLon = (targetLng - userCoords.lng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(userCoords.lat * Math.PI / 180) * Math.cos(targetLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c; // Distance in miles

            const walkSpeedMph = 3.0; // Average walking pace
            const timeMinutes = Math.round((distance / walkSpeedMph) * 60);

            return `${distance.toFixed(2)} mi away (~${timeMinutes} min walk)`;
        }

        // Fallback-friendly load handler for embedded baseline data
        function fetchLiveBuses() {
            document.getElementById('status').innerText = 'Status: Loading stops...';
            clearBusMarkers();

            // Pull directly from local fallback payload bundle
            const cachedData = localStorage.getItem('heleon_cached_bus_data');
            if (cachedData) {
                const buses = JSON.parse(cachedData);
                renderBuses(buses, true);
                document.getElementById('status').innerText = `Status: Loaded (${buses.length} baseline routes)`;
            } else {
                alert('No schedule data found.');
            }
        }

        function renderBuses(buses, isCached = false) {
            buses.forEach(bus => {
                const walkEstimate = getWalkTimeEstimate(bus.lat, bus.lng);
                const badge = isCached ? ' <span style="color:#f59e0b;">[Baseline Mode]</span>' : '';
                const marker = L.marker([bus.lat, bus.lng], { icon: busIcon })
                    .addTo(map)
                    .bindPopup(`<b>${bus.route}</b>${badge}<br>Status: ${bus.updated}<br>${walkEstimate}`);
                busMarkers.push(marker);
            });
        }

        function clearBusMarkers() {
            busMarkers.forEach(m => map.removeLayer(m));
            busMarkers = [];
        }

        function toggleOfflineMode() {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            const next = current === 'disabled' ? 'enabled' : 'disabled';
            localStorage.setItem('heleon_cache_mode', next);
            updateCacheButtonStyle(next);
        }

        function updateCacheButtonStyle(mode) {
            const btn = document.getElementById('cache-btn');
            if (mode === 'enabled') {
                btn.innerText = "Cache Mode: ON";
                btn.classList.add('cache-active');
            } else {
                btn.innerText = "Cache Mode: OFF";
                btn.classList.remove('cache-active');
            }
        }

        function checkServiceAlerts() {
            const alertsBar = document.getElementById('alerts-bar');
            const alertText = document.getElementById('alert-text');
            const activeNotice = "Operating on standard rural schedule framework.";

            if (activeNotice) {
                alertText.innerText = activeNotice;
                alertsBar.style.display = 'block';
            } else {
                alertsBar.style.display = 'none';
            }
        }
    </script>
</body>
</html>
