<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Stop Map & Timetable</title>
    <!-- Leaflet CSS for Map Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        h1 { font-size: 1.1rem; color: #38bdf8; }
        .controls { display: flex; gap: 8px; width: 100%; }
        select { flex: 1; background: #334155; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; }
        #map { flex: 1; width: 100%; background: #0f172a; z-index: 1; }
        
        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b !important; color: #f8fafc !important; border: 1px solid #475569; border-radius: 8px; }
        .leaflet-popup-content { font-size: 0.9rem; line-height: 1.4; margin: 12px; }
        .popup-stop-name { font-weight: bold; color: #38bdf8; font-size: 1rem; margin-bottom: 6px; display: block; }
        .popup-times-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; margin-bottom: 2px; }
        .popup-times-list { list-style-type: none; padding-left: 0; max-height: 120px; overflow-y: auto; }
        .popup-times-list li { background: #0f172a; padding: 4px 6px; margin-bottom: 3px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; color: #4ade80; }
        
        /* GPS Marker Styling */
        .user-loc-dot { background: #2563eb; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(37, 99, 235, 0.8); }
    </style>
</head>
<body>

    <header>
        <h1>Hele-On Stop & Schedule Map</h1>
        <div class="controls">
            <select id="route-select" onchange="loadRouteOnMap()">
                <option value="402">Route 402: HPP / Makuū / Ainaloa</option>
                <option value="401">Route 401: Hawaiian Beaches / Pahoa</option>
                <option value="40">Route 40: Hilo to Pahoa</option>
                <option value="11">Route 11: Hilo to Volcano</option>
                <option value="1">Route 1: Hilo to Kona</option>
            </select>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map centered roughly over Puna/East Hawaii
        const map = L.map('map').setView([19.5750, -155.0000], 13);

        // Free OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let userMarker = null;

        // Complete Master Database of Official Stops & Timetables
        const networkDatabase = {
            '402': {
                name: 'Route 402: Hawaiian Paradise Park / Ainaloa (via Makuū)',
                stops: [
                    { name: 'Puna Kai Shopping Center (Keaʻau-Pahoa Rd)', lat: 19.5012, lng: -154.9795, times: ['05:30 AM', '07:30 AM', '01:30 PM', '03:30 PM', '05:30 PM', '07:30 PM'] },
                    { name: 'Makuū Drive @ 31st Avenue', lat: 19.5780, lng: -155.0080, times: ['05:37 AM', '07:37 AM', '01:37 PM', '03:37 PM', '05:37 PM', '07:37 PM'] },
                    { name: 'Makuū Drive @ 25th Avenue', lat: 19.5765, lng: -155.0040, times: ['05:39 AM', '07:39 AM', '01:39 PM', '03:39 PM', '05:39 PM', '07:39 PM'] },
                    { name: 'Makuū Drive @ 21st Avenue', lat: 19.5755, lng: -155.0015, times: ['05:41 AM', '07:41 AM', '01:41 PM', '03:41 PM', '05:41 PM', '07:41 PM'] },
                    { name: 'Makuū Drive @ 16th Avenue (Community Center Shelter)', lat: 19.5740, lng: -154.9975, times: ['05:43 AM', '07:43 AM', '01:43 PM', '03:43 PM', '05:43 PM', '07:43 PM'] },
                    { name: 'Makuū Drive @ 12th Avenue', lat: 19.5725, lng: -154.9940, times: ['05:45 AM', '07:45 AM', '01:45 PM', '03:45 PM', '05:45 PM', '07:45 PM'] },
                    { name: 'Makuū Drive @ 8th Avenue', lat: 19.5710, lng: -154.9910, times: ['05:47 AM', '07:47 AM', '01:47 PM', '03:47 PM', '05:47 PM', '07:47 PM'] },
                    { name: 'Makuū Drive @ 4th Avenue', lat: 19.5695, lng: -154.9875, times: ['05:49 AM', '07:49 AM', '01:49 PM', '03:49 PM', '05:49 PM', '07:49 PM'] },
                    { name: 'Makuū Drive @ 1st Avenue', lat: 19.5685, lng: -154.9850, times: ['05:50 AM', '07:50 AM', '01:50 PM', '03:50 PM', '05:50 PM', '07:50 PM'] },
                    { name: 'Paradise Drive @ 1st Avenue', lat: 19.6000, lng: -155.0200, times: ['05:51 AM', '07:51 AM', '01:51 PM', '03:51 PM', '05:51 PM', '07:51 PM'] },
                    { name: 'Paradise Drive @ 14th Avenue', lat: 19.5960, lng: -155.0110, times: ['05:55 AM', '07:55 AM', '01:55 PM', '03:55 PM', '05:55 PM', '07:55 PM'] },
                    { name: 'Paradise Drive @ 25th Avenue', lat: 19.5920, lng: -155.0020, times: ['05:59 AM', '07:59 AM', '01:59 PM', '03:59 PM', '05:59 PM', '07:59 PM'] },
                    { name: 'Old Volcano Road @ Keaʻau Post Office', lat: 19.6235, lng: -155.0380, times: ['06:25 AM', '08:25 AM', '02:25 PM', '04:25 PM', '06:25 PM', '08:25 PM'] }
                ]
            },
            '401': {
                name: 'Route 401: Hawaiian Beaches / Puna',
                stops: [
                    { name: 'Puna Kai Shopping Center (Pahoa Hub)', lat: 19.5000, lng: -154.9800, times: ['06:30 AM', '09:00 AM', '12:30 PM', '03:30 PM', '05:30 PM'] },
                    { name: 'Hawaiian Beaches (Beach Rd Shelter)', lat: 19.4900, lng: -154.9500, times: ['06:45 AM', '09:15 AM', '12:45 PM', '03:45 PM', '05:45 PM'] },
                    { name: 'Nanawale Blvd Turnaround', lat: 19.4850, lng: -154.9300, times: ['06:55 AM', '09:25 AM', '12:55 PM', '03:55 PM', '05:55 PM'] }
                ]
            },
            '40': {
                name: 'Route 40: Hilo to Pahoa',
                stops: [
                    { name: 'Moʻoheau Bus Terminal', lat: 19.7215, lng: -155.0847, times: ['06:15 AM', '09:30 AM', '12:30 PM', '03:45 PM', '06:00 PM'] },
                    { name: 'Prince Kuhiō Plaza', lat: 19.6880, lng: -155.0810, times: ['06:27 AM', '09:42 AM', '12:42 PM', '03:57 PM', '06:12 PM'] },
                    { name: 'Keaʻau Village Hub', lat: 19.6235, lng: -155.0380, times: ['06:40 AM', '09:55 AM', '12:55 PM', '04:10 PM', '06:25 PM'] },
                    { name: 'Puna Kai Shopping Center (Pahoa)', lat: 19.5000, lng: -154.9800, times: ['07:10 AM', '10:25 AM', '01:25 PM', '04:40 PM', '06:55 PM'] }
                ]
            },
            '11': {
                name: 'Route 11 (Red Line): Hilo to Volcano',
                stops: [
                    { name: 'Moʻoheau Bus Terminal', lat: 19.7215, lng: -155.0847, times: ['05:00 AM', '07:30 AM', '12:00 PM', '03:30 PM'] },
                    { name: 'Prince Kuhiō Plaza', lat: 19.6880, lng: -155.0810, times: ['05:12 AM', '07:42 AM', '12:12 PM', '03:42 PM'] },
                    { name: 'Keaʻau Village Hub', lat: 19.6235, lng: -155.0380, times: ['05:25 AM', '07:55 AM', '12:25 PM', '03:55 PM'] },
                    { name: 'Hawaii Volcanoes National Park Visitor Center', lat: 19.4284, lng: -155.2558, times: ['06:10 AM', '08:40 AM', '01:10 PM', '04:40 PM'] }
                ]
            },
            '1': {
                name: 'Route 1: Hilo to Kailua-Kona',
                stops: [
                    { name: 'Moʻoheau Bus Terminal', lat: 19.7215, lng: -155.0847, times: ['04:45 AM', '08:15 AM', '01:30 PM'] },
                    { name: 'Keaʻau Town Center', lat: 19.6235, lng: -155.0380, times: ['05:15 AM', '08:45 AM', '02:00 PM'] },
                    { name: 'Waimea Park and Ride', lat: 19.9531, lng: -155.6723, times: ['06:30 AM', '10:00 AM', '03:15 PM'] },
                    { name: 'Loloku Street Park and Ride (Kona Hub)', lat: 19.6400, lng: -155.9969, times: ['08:00 AM', '11:30 AM', '04:45 PM'] }
                ]
            }
        };

        function loadRouteOnMap() {
            const routeId = document.getElementById('route-select').value;
            const routeData = networkDatabase[routeId];
            
            markersLayer.clearLayers();

            if (!routeData) return;

            let latLngs = [];

            routeData.stops.forEach((stop, index) => {
                latLngs.push([stop.lat, stop.lng]);

                let timesHtml = stop.times.map(t => `<li>Scheduled: ${t}</li>`).join('');
                let popupContent = `
                    <span class="popup-stop-name">${index + 1}. ${stop.name}</span>
                    <div class="popup-times-title">Official Timetable:</div>
                    <ul class="popup-times-list">${timesHtml}</ul>
                `;

                let marker = L.marker([stop.lat, stop.lng]).bindPopup(popupContent);
                markersLayer.addLayer(marker);
            });

            if (latLngs.length > 0) {
                map.fitBounds(latLngs, { padding: [50, 50] });
            }
        }

        // Track user GPS location on the map in real time
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(position => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                if (!userMarker) {
                    let userIcon = L.divIcon({
                        className: 'user-loc-dot',
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });
                    userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup("<b>You are here</b>");
                } else {
                    userMarker.setLatLng([userLat, userLng]);
                }
            }, error => {
                console.log("GPS Location unavailable: ", error.message);
            }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }

        loadRouteOnMap();
    </script>
</body>
</html>
