        .controls { display: flex; flex-direction: column; gap: 8px; background: #1e1e1e; padding: 10px; border-radius: 6px; border: 1px solid #333; margin-bottom: 12px; }
        select, button { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; font-size: 0.95rem; width: 100%; cursor: pointer; }
        select { background: #2a2a2a; border: 1px solid #444; }
        button:hover { background: #1d4ed8; }
        #status { font-size: 0.85rem; color: #4ade80; font-weight: bold; margin-top: 4px; }
        .stop-card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
        .stop-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .stop-name { font-weight: bold; color: #60a5fa; font-size: 1rem; }
        .badge { background: #374151; color: #d1d5db; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .badge-transfer { background: #065f46; color: #a7f3d0; }
        .schedule-list { margin-top: 8px; padding-left: 16px; font-size: 0.9rem; color: #d1d5db; }
        .schedule-list li { margin-bottom: 4px; }
        .dist-info { font-size: 0.85rem; color: #fbbf24; margin-top: 6px; }
        .nav-link { display: inline-block; margin-top: 6px; color: #38bdf8; text-decoration: underline; font-size: 0.85rem; font-weight: bold; }
    </style>

        function displayRouteStops() {
            activeRouteId = document.getElementById('route-select').value;
            const container = document.getElementById('stops-container');
            container.innerHTML = '';

            if (!activeRouteId || !fullNetworkData[activeRouteId]) {
                document.getElementById('status').innerText = 'Status: Please select a valid route above.';
                return;
            }

            const route = fullNetworkData[activeRouteId];
            document.getElementById('status').innerText = `Status: Displaying all ${route.stops.length} stops for ${route.title}`;

            renderStopCards(route.stops, route.pdf);
        }

        function renderStopCards(stopsArray, pdfUrl) {
            const container = document.getElementById('stops-container');
            container.innerHTML = '';

            stopsArray.forEach((stop, index) => {
                let distanceText = "";
                if (userCoords) {
                    distanceText = `<div class="dist-info">📍 ${calculateDistance(userCoords.lat, userCoords.lng, stop.lat, stop.lng)}</div>`;
                }

                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.lng}`;

                const card = document.createElement('div');
                card.className = 'stop-card';
                card.innerHTML = `
                    <div class="stop-header">
                        <span class="stop-name">${index + 1}. ${stop.name}</span>
                        <span class="badge ${stop.isTransfer ? 'badge-transfer' : ''}">${stop.isTransfer ? 'Transfer Hub' : 'Stop'}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 4px;">Scheduled Times:</div>
                    <ul class="schedule-list">
                        ${stop.times.map(t => `<li>${t}</li>`).join('')}
                    </ul>
                    ${distanceText}
                    <div style="margin-top: 8px; display: flex; gap: 12px;">
                        <a class="nav-link" href="${mapsUrl}" target="_blank">Open Stop in Maps</a>
                        <a class="nav-link" href="${pdfUrl}" target="_blank">Official Route PDF</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function locateAndSortStops() {
            document.getElementById('status').innerText = 'Status: Acquiring GPS location...';
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    userCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    document.getElementById('status').innerText = 'Status: Located! Stops sorted by your proximity.';
                    
                    if (activeRouteId && fullNetworkData[activeRouteId]) {
                        sortAndDisplayCurrentRoute();
                    } else {
                        // If no route selected, default to Route 402 so they see Makuū immediately sorted
                        document.getElementById('route-select').value = 'route-402';
                        displayRouteStops();
                        sortAndDisplayCurrentRoute();
                    }
                }, error => {
                    document.getElementById('status').innerText = 'Status: GPS Location failed.';
                    alert('Could not get your position. Check phone location permissions.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Geolocation not supported on this browser.');
            }
        }

        function sortAndDisplayCurrentRoute() {
            activeRouteId = document.getElementById('route-select').value;
            if (!activeRouteId) return;
            const route = fullNetworkData[activeRouteId];

            // Sort stops by distance to user
            const sortedStops = [...route.stops].sort((a, b) => {
                const distA = getRawDistance(userCoords.lat, userCoords.lng, a.lat, a.lng);
                const distB = getRawDistance(userCoords.lat, userCoords.lng, b.lat, b.lng);
                return distA - distB;
            });

            renderStopCards(sortedStops, route.pdf);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const distMiles = getRawDistance(lat1, lon1, lat2, lon2);
            const walkTimeMinutes = Math.round((distMiles / 3.0) * 60);
            return `${distMiles.toFixed(2)} miles away (~${walkTimeMinutes} min walk)`;
        }

        function getRawDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // Radius of earth in miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
