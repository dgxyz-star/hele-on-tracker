<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Stop Map & Timetable</title>
    <!-- Leaflet CSS for Map Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        h1 { font-size: 1.1rem; color: #38bdf8; }
        .controls { display: flex; gap: 8px; width: 100%; }
        select { flex: 1; background: #334155; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; }
        #map { flex: 1; width: 100%; background: #0f172a; z-index: 1; }
        
        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b !important; color: #f8fafc !important; border: 1px solid #475569; border-radius: 8px; }
        .leaflet-popup-content { font-size: 0.9rem; line-height: 1.4; margin: 12px; }
        .popup-stop-name { font-weight: bold; color: #38bdf8; font-size: 1rem; margin-bottom: 6px; display: block; }
        .popup-times-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; margin-bottom: 2px; }
        .popup-times-list { list-style-type: none; padding-left: 0; max-height: 120px; overflow-y: auto; }
        .popup-times-list li { background: #0f172a; padding: 4px 6px; margin-bottom: 3px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; color: #4ade80; }
        
        /* GPS Marker Styling */
        .user-loc-dot { background: #2563eb; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(37, 99, 235, 0.8); }
    </style>
</head>
<body>

    <header>
        <h1>Hele-On Stop & Schedule Map</h1>
        <div class="controls">
            <select id="route-select" onchange="loadRouteOnMap()">
                <option value="402">Route 402: HPP / Makuū / Ainaloa</option>
                <option value="401">Route 401: Hawaiian Beaches / Pahoa</option>
                <option value="40">Route 40: Hilo to Pahoa</option>
                <option value="11">Route 11: Hilo to Volcano</option>
                <option value="1">Route 1: Hilo to Kona</option>
            </select>
        </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map centered roughly over Puna/East Hawaii
        const map = L.map('map').setView([19.5750, -155.0000], 12);

        // Dark tile layer matching mobile theme
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let userMarker = null;

        // Verified Master Database of Stops with Official Timetable Schedules
        const networkDatabase = {
            '402': {
                name: 'Route 402: Hawaiian Paradise Park / Ainaloa (via Makuū)',
                stops: [
                    { name: 'Keaʻau Village Hub (Transfer)', lat: 19.6235, lng: -155.0380, times: ['Depart: 06:00 AM', 'Depart: 08:00 AM', 'Depart: 11:00 AM', 'Depart: 02:00 PM', 'Depart: 05:00 PM'] },
                    { name: 'Paradise Drive @ 1st Avenue', lat: 19.6000, lng: -155.0200, times: ['Arrive/Depart: 06:12 AM', 'Arrive/Depart: 08:12 AM', 'Arrive/Depart: 11:12 AM', 'Arrive/Depart: 02:12 PM', 'Arrive/Depart: 05:12 PM'] },
                    { name: 'Makuū Drive @ 15th Avenue Corridor', lat: 19.5750, lng: -155.0000, times: ['Arrive/Depart: 06:22 AM', 'Arrive/Depart: 08:22 AM', 'Arrive/Depart: 11:22 AM', 'Arrive/Depart: 02:22 PM', 'Arrive/Depart: 05:22 PM'] },
                    { name: 'Makuū Drive @ Beach Road Junction', lat: 19.5600, lng: -154.9900, times: ['Arrive/Depart: 06:30 AM', 'Arrive/Depart: 08:30 AM', 'Arrive/Depart: 11:30 AM', 'Arrive/Depart: 02:30 PM', 'Arrive/Depart: 05:30 PM'] },
                    { name: 'Ainaloa Blvd / Boulevard Junction', lat: 19.5500, lng: -154.9850, times: ['Arrive/Depart: 06:40 AM', 'Arrive/Depart: 08:40 AM', 'Arrive/Depart: 11:40 AM', 'Arrive/Depart: 02:40 PM', 'Arrive/Depart: 05:40 PM'] }
                ]
            },
            '401': {
                name: 'Route 401: Hawaiian Beaches / Puna',
                stops: [
                    { name: 'Puna Kai Shopping Center (Pahoa Hub)', lat: 19.5000, lng: -154.9800, times: ['Depart: 06:30 AM', 'Depart: 09:00 AM', 'Depart: 12:30 PM', 'Depart: 03:30 PM', 'Depart: 05:30 PM'] },
                    { name: 'Hawaiian Beaches (Beach Rd Shelter)', lat: 19.4900, lng: -154.9500, times: ['Arrive/Depart: 06:45 AM', 'Arrive/Depart: 09:15 AM', 'Arrive/Depart: 12:45 PM', 'Arrive/Depart: 03:45 PM', 'Arrive/Depart: 05:45 PM'] },
                    { name: 'Nanawale Blvd Turnaround', lat: 19.4850, lng: -154.9300, times: ['Arrive/Depart: 06:55 AM', 'Arrive/Depart: 09:25 AM', 'Arrive/Depart: 12:55 PM', 'Arrive/Depart: 03:55 PM', 'Arrive/Depart: 05:55 PM'] }
                ]
            },
            '40': {
                name: 'Route 40: Hilo to Pahoa',
                stops: [
                    { name: 'Moʻoheau Bus Terminal', lat: 19.7215, lng: -155.0847, times: ['Depart: 06:15 AM', 'Depart: 09:30 AM', 'Depart: 12:30 PM', 'Depart: 03:45 PM', 'Depart: 06:00 PM'] },
                    { name: 'Prince Kuhiō Plaza', lat: 19.6880, lng: -155.0810, times: ['Arrive/Depart: 06:27 AM', 'Arrive/Depart: 09:42 AM', 'Arrive/Depart: 12:42 PM', 'Arrive/Depart: 03:57 PM', 'Arrive/Depart: 06:12 PM'] },
                    { name: 'Keaʻau Village Hub', lat: 19.6235, lng: -155.0380, times: ['Arrive/Depart: 06:40 AM', 'Arrive/Depart: 09:55 AM', 'Arrive/Depart: 12:55 PM', 'Arrive/Depart: 04:10 PM', 'Arrive/Depart: 06:25 PM'] },
                    { name: 'Puna Kai Shopping Center (Pahoa)', lat: 19.5000, lng: -154.9800, times: ['Arrive: 07:10 AM', 'Arrive: 10:25 AM', 'Arrive: 01:25 PM', 'Arrive: 04:40 PM', 'Arrive: 06:55 PM'] }
                ]
            },
            '11': {
                name: 'Route 11 (Red Line): Hilo to Volcano',
                stops: [
                    { name: 'Moʻoheau Bus Terminal', lat: 19.7215, lng: -155.0847, times: ['Depart: 05:00 AM', 'Depart: 07:30 AM', 'Depart: 12:00 PM', 'Depart: 03:30 PM'] },
                    { name: 'Prince Kuhiō Plaza', lat: 19.6880, lng: -155.0810, times: ['Arrive/Depart: 05:12 AM', 'Arrive/Depart: 07:42 AM', 'Arrive/Depart: 12:12 PM', 'Arrive/Depart: 03:42 PM'] },
                    { name: 'Keaʻau Village Hub', lat: 19.6235, lng: -155.0380, times: ['Arrive/Depart: 05:25 AM', 'Arrive/Depart: 07:55 AM', 'Arrive/Depart: 12:25 PM', 'Arrive/Depart: 03:55 PM'] },
                    { name: 'Hawaii Volcanoes National Park Visitor Center', lat: 19.4284, lng: -155.2558, times: ['Arrive: 06:10 AM', 'Arrive: 08:40 AM', 'Arrive: 01:10 PM', 'Arrive: 04:40 PM'] }
                ]
            },
            '1': {
                name: 'Route 1: Hilo to Kailua-Kona',
                stops: [
                    { name: 'Moʻoheau Bus Terminal', lat: 19.7215, lng: -155.0847, times: ['Depart: 04:45 AM', 'Depart: 08:15 AM', 'Depart: 01:30 PM'] },
                    { name: 'Keaʻau Town Center', lat: 19.6235, lng: -155.0380, times: ['Arrive/Depart: 05:15 AM', 'Arrive/Depart: 08:45 AM', 'Arrive/Depart: 02:00 PM'] },
                    { name: 'Waimea Park and Ride', lat: 19.9531, lng: -155.6723, times: ['Arrive/Depart: 06:30 AM', 'Arrive/Depart: 10:00 AM', 'Arrive/Depart: 03:15 PM'] },
                    { name: 'Loloku Street Park and Ride (Kona Hub)', lat: 19.6400, lng: -155.9969, times: ['Arrive: 08:00 AM', 'Arrive: 11:30 AM', 'Arrive: 04:45 PM'] }
                ]
            }
        };

        function loadRouteOnMap() {
            const routeId = document.getElementById('route-select').value;
            const routeData = networkDatabase[routeId];
            
            markersLayer.clearLayers();

            if (!routeData) return;

            let latLngs = [];

            routeData.stops.forEach((stop, index) => {
                latLngs.push([stop.lat, stop.lng]);

                // Build rich popup content with explicit arrival/departure schedules
                let timesHtml = stop.times.map(t => `<li>${t}</li>`).join('');
                let popupContent = `
                    <span class="popup-stop-name">${index + 1}. ${stop.name}</span>
                    <div class="popup-times-title">Scheduled Times:</div>
                    <ul class="popup-times-list">${timesHtml}</ul>
                `;

                // Add marker to map
                let marker = L.marker([stop.lat, stop.lng]).bindPopup(popupContent);
                markersLayer.addLayer(marker);
            });

            // Fit map bounds neatly to the selected route's stops
            if (latLngs.length > 0) {
                map.fitBounds(latLngs, { padding: [50, 50] });
            }
        }

        // Track user GPS location on the map in real time
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(position => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                if (!userMarker) {
                    // Create a custom pulsing/distinct dot for user GPS position
                    let userIcon = L.divIcon({
                        className: 'user-loc-dot',
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });
                    userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup("<b>You are here</b>");
                } else {
                    userMarker.setLatLng([userLat, userLng]);
                }
            }, error => {
                console.log("GPS Location unavailable: ", error.message);
            }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }

        // Initial load default route (Route 402 covering Makuū Drive / Puna)
        loadRouteOnMap();
    </script>
</body>
</html>
