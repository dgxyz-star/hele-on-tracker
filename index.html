<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hele-On Offline/Low-Data Tracker</title>
    <!-- Leaflet CSS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #e0e0e0; }
        #controls { padding: 10px; background: #1e1e1e; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #333; align-items: center; }
        button, select { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        select { background: #2a2a2a; border: 1px solid #444; }
        button:hover, select:hover { background: #1d4ed8; }
        button.cache-active { background: #16a34a; }
        #status { font-size: 0.85rem; color: #aaa; margin-left: auto; }
        #alerts-bar { background: #854d0e; color: #fef08a; padding: 8px 10px; font-size: 0.85rem; display: none; border-bottom: 1px solid #713f12; }
        #map { flex: 1; width: 100%; background: #242424; }
        #info-panel { background: #1e1e1e; padding: 12px; border-top: 1px solid #333; font-size: 0.9rem; max-height: 150px; overflow-y: auto; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="controls">
        <select id="route-select" onchange="filterRouteSchedule()">
            <option value="all">-- View All Routes --</option>
            <option value="puna-hilo">Route 10: Puna / Hilo Express</option>
            <option value="volcano-kona">Route 80: Volcano / Kona Connector</option>
            <option value="pahoa-shuttle">Route 40: Pahoa / Keaau Shuttle</option>
            <option value="hilo-town">Route 1: Hilo Town Circulator</option>
        </select>
        <button onclick="fetchLiveBuses()">Load Stops</button>
        <button onclick="locateUser()">Locate Me</button>
        <button id="cache-btn" onclick="toggleOfflineMode()">Cache Mode: OFF</button>
        <span id="status">Status: Ready</span>
    </div>

    <div id="alerts-bar"><strong>Service Alert:</strong> <span id="alert-text">Checking for notices...</span></div>

    <div id="map"></div>

    <div id="info-panel">
        <strong>Transit Info:</strong> Select a route from the dropdown or click a bus stop marker to view schedule details and walking estimates.
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Default focus center: Big Island / Hilo area
        const DEFAULT_LAT = 19.7241;
        const DEFAULT_LON = -155.0868;

        const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], 10);

        // Esri World Gray Canvas tiles (open, no API key required)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
        }).addTo(map);

        let userMarker = null;
        let busMarkers = [];
        let userCoords = null;

        // Comprehensive baseline dataset representing parsed Hele-On schedule waypoints
        const heleOnRoutesData = [
            { id: 'puna-hilo', name: 'Route 10: Puna / Hilo Express', lat: 19.6500, lng: -155.0300, schedule: 'Departs Pahoa: 06:15 AM, 12:30 PM | Arrives Hilo: 07:00 AM, 01:15 PM', status: 'On Schedule (Baseline Cached)' },
            { id: 'puna-hilo', name: 'Route 10: Puna / Hilo Express (Transit Hub)', lat: 19.7150, lng: -155.0900, schedule: 'Aupuni Center / Moikeha Building Stop', status: 'Active Hub' },
            { id: 'volcano-kona', name: 'Route 80: Volcano / Kona Connector', lat: 19.4284, lng: -155.2558, schedule: 'Volcano Village: 07:30 AM | Arrives Kona Oceanfront: 09:15 AM', status: 'Scheduled Run' },
            { id: 'volcano-kona', name: 'Route 80: Volcano / Kona Connector (Kona Stop)', lat: 19.6400, lng: -155.9969, schedule: 'Kona Target / Palani Rd Junction', status: 'Regular Stop' },
            { id: 'pahoa-shuttle', name: 'Route 40: Pahoa / Keaau Shuttle', lat: 19.5000, lng: -154.9800, schedule: 'Pahoa District Park: Hourly from 06:00 AM to 06:00 PM', status: 'Shuttle Active' },
            { id: 'hilo-town', name: 'Route 1: Hilo Town Circulator', lat: 19.7297, lng: -155.0900, schedule: 'Downtown Hilo / Coqui St Loop: Every 45 mins', status: 'Frequent Service' }
        ];

        // Initialize state on load
        window.addEventListener('DOMContentLoaded', () => {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            updateCacheButtonStyle(current);
            checkServiceAlerts();
            
            // Seed local storage with structured route fallback payload
            if (!localStorage.getItem('heleon_cached_bus_data')) {
                localStorage.setItem('heleon_cached_bus_data', JSON.stringify(heleOnRoutesData));
            }
            fetchLiveBuses();
        });

        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        // Track User GPS Position
        function locateUser() {
            document.getElementById('status').innerText = 'Status: Locating...';
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    userCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.marker([userCoords.lat, userCoords.lng])
                        .addTo(map)
                        .bindPopup("<b>You are here</b>")
                        .openPopup();

                    map.setView([userCoords.lat, userCoords.lng], 13);
                    document.getElementById('status').innerText = 'Status: Position Located';
                }, error => {
                    document.getElementById('status').innerText = 'Status: GPS Failed';
                    alert('Unable to acquire location. Check browser site permissions.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }

        // Calculate straight-line distance and walking estimate
        function getWalkTimeEstimate(targetLat, targetLng) {
            if (!userCoords) return "Locate yourself for walk estimates.";

            const R = 3958.8; // Earth radius in miles
            const dLat = (targetLat - userCoords.lat) * Math.PI / 180;
            const dLon = (targetLng - userCoords.lng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(userCoords.lat * Math.PI / 180) * Math.cos(targetLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            const walkSpeedMph = 3.0;
            const timeMinutes = Math.round((distance / walkSpeedMph) * 60);

            return `${distance.toFixed(2)} mi away (~${timeMinutes} min walk)`;
        }

        function fetchLiveBuses() {
            document.getElementById('status').innerText = 'Status: Loading stops...';
            clearBusMarkers();

            const cachedData = localStorage.getItem('heleon_cached_bus_data');
            if (cachedData) {
                const buses = JSON.parse(cachedData);
                renderBuses(buses);
                document.getElementById('status').innerText = `Status: Loaded (${buses.length} stops)`;
            } else {
                alert('No schedule data found.');
            }
        }

        function renderBuses(buses) {
            buses.forEach(bus => {
                const walkEstimate = getWalkTimeEstimate(bus.lat, bus.lng);
                const marker = L.marker([bus.lat, bus.lng], { icon: busIcon })
                    .addTo(map)
                    .bindPopup(`<b>${bus.name}</b><br>Schedule: ${bus.schedule}<br>Status: ${bus.status}<br>${walkEstimate}`);
                
                marker.routeId = bus.id;
                marker.routeDetails = bus;
                
                marker.on('click', () => {
                    document.getElementById('info-panel').innerHTML = `
                        <strong>Selected Stop / Route:</strong> ${bus.name}<br>
                        <strong>Timetable Info:</strong> ${bus.schedule}<br>
                        <strong>Status:</strong> ${bus.status} | <strong>Distance:</strong> ${getWalkTimeEstimate(bus.lat, bus.lng)}
                    `;
                });

                busMarkers.push(marker);
            });
        }

        function filterRouteSchedule() {
            const selectedRoute = document.getElementById('route-select').value;
            clearBusMarkers();

            const cachedData = JSON.parse(localStorage.getItem('heleon_cached_bus_data') || '[]');
            const filtered = selectedRoute === 'all' 
                ? cachedData 
                : cachedData.filter(b => b.id === selectedRoute);

            renderBuses(filtered);

            if (selectedRoute !== 'all' && filtered.length > 0) {
                map.setView([filtered[0].lat, filtered[0].lng], 12);
                document.getElementById('info-panel').innerHTML = `
                    <strong>Active Route Filter:</strong> ${filtered[0].name}<br>
                    <strong>Timetable Summary:</strong> ${filtered.map(f => f.schedule).join(' | ')}
                `;
            } else {
                document.getElementById('info-panel').innerHTML = `<strong>Transit Info:</strong> Showing all route stops across the system network.`;
            }
        }

        function clearBusMarkers() {
            busMarkers.forEach(m => map.removeLayer(m));
            busMarkers = [];
        }

        function toggleOfflineMode() {
            const current = localStorage.getItem('heleon_cache_mode') || 'disabled';
            const next = current === 'disabled' ? 'enabled' : 'disabled';
            localStorage.setItem('heleon_cache_mode', next);
            updateCacheButtonStyle(next);
        }

        function updateCacheButtonStyle(mode) {
            const btn = document.getElementById('cache-btn');
            if (mode === 'enabled') {
                btn.innerText = "Cache Mode: ON";
                btn.classList.add('cache-active');
            } else {
                btn.innerText = "Cache Mode: OFF";
                btn.classList.remove('cache-active');
            }
        }

        function checkServiceAlerts() {
            const alertsBar = document.getElementById('alerts-bar');
            const alertText = document.getElementById('alert-text');
            const activeNotice = "Operating on standard island-wide rural schedule framework.";

            if (activeNotice) {
                alertText.innerText = activeNotice;
                alertsBar.style.display = 'block';
            } else {
                alertsBar.style.display = 'none';
            }
        }
    </script>
</body>
</html>
